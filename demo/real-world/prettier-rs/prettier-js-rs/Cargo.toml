[package]
name = "prettier-js-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of Prettier's JavaScript/TypeScript printer (subset), on oxc's ESTree output"

[dependencies]
doc-printer-rs = { path = "../doc-printer-rs" }
oxc_allocator = "0.158"
oxc_ast = { version = "0.158", features = ["serialize"] }
oxc_parser = "0.158"
oxc_span = "0.158"
regex = "1"
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }

[profile.release]
lto = true

# Fast-building profile for mutation testing (equiv/mutants): each mutant rebuilds this crate.
[profile.mutants]
inherits = "release"
lto = false
opt-level = 1
codegen-units = 256
incremental = true
